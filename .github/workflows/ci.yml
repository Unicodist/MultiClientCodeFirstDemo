name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore MultiTenantDemo.sln
          dotnet tool restore

      - name: Build
        run: dotnet build MultiTenantDemo.sln --no-restore --configuration Release

      - name: Integration tests (SQL Server via Testcontainers)
        run: dotnet test MultiTenantDemo.sln --no-build --configuration Release --logger trx --results-directory artifacts/test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-artifacts
          path: artifacts/
